spring.config.import=optional:file:.env[.properties]
spring.application.name=repolens

server.port=8081
# Database
# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/repolens_db}
spring.datasource.username=postgres
spring.datasource.password=${DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# Gemini Developer API (Google AI Studio)
spring.ai.google.genai.api-key=${GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
app.ai.embedding.model=gemini-embedding-001
app.ai.embedding.dimensions=768

#PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

#github 
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# Session cookie configuration
server.servlet.session.cookie.name=repolens_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# App settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=JeDRTI1JY+nDEkJYu6Ge54PaRqaCEqg7TpZfKh35iHA=
app.token-encryptor-salt=${ENCRYPTOR_SALT}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.github.chunk-overlap=100
app.github.api-delay-ms=50